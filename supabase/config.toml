# Supabase local development config.
# See: https://supabase.com/docs/guides/local-development/cli/config

project_id = "mapa-de-autoras"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Local Postgres major version. Bumped 15 → 17 on 2026-07-01: the Supabase CLI
# (>= 2.102) initialises local volumes with PostgreSQL 17.x, so a PG15 pin left
# a stale PG15 data dir that a PG17 server refused to open. Keep this aligned
# with the hosted staging/prod Postgres major version (verify in the Supabase
# dashboard → Project Settings → Infrastructure) to preserve local↔prod parity.
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.seed]
enabled = true

sql_paths = ["./seed.sql", "./seeds/dev-authors.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"
openai_api_key = "env(OPENAI_API_KEY)"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:4321"
additional_redirect_urls = [
  "http://127.0.0.1:4321",
  "http://127.0.0.1:4321/",
  "http://127.0.0.1:4321/admin",
  "http://127.0.0.1:4321/admin/inbox",
  "http://localhost:4321",
  "http://localhost:4321/",
  "http://localhost:4321/admin",
  "http://localhost:4321/admin/inbox",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
# `enable_signup = true` is required for GoTrue to allow magic-link sign-in
# AT ALL (signup and signin share the same flag). New-user creation is blocked
# client-side via supabase.auth.signInWithOtp({ shouldCreateUser: false }) in
# src/lib/admin-session.ts. Since the admin form is the only client that hits
# this endpoint, the guarantee holds.
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[auth.sms]
enable_signup = false
enable_confirmations = false
template = "Your code is {{ .Code }}"

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

# Function-level config. With `verify_jwt = false`, `supabase functions serve`
# accepts anonymous POSTs to /functions/v1/submit_suggestion — Turnstile is
# our gate, not JWT. Env vars (TURNSTILE_SECRET_KEY) still need to be passed
# via `--env-file .env` because the CLI doesn't auto-load .env for functions.
[functions.submit_suggestion]
enabled = true
verify_jwt = false

[functions.notify_owner]
enabled = true
verify_jwt = false

# Stage 7b-i — admin-only translate proxy to DeepL. `verify_jwt = false`
# because Supabase's platform-level JWT check rejects CORS preflight (OPTIONS
# strips Authorization) on hosted, blocking the actual POST. The function
# itself decodes the bearer JWT and asserts app_metadata.role === 'admin' —
# same security posture, gate just moved from platform to function code.
[functions.translate]
enabled = true
verify_jwt = false

# Disabled on Windows: Vector log collector requires Docker daemon exposed on
# tcp://localhost:2375, which Docker Desktop doesn't enable by default. Without
# this flag the supabase_vector_* container restart-loops with no impact on
# Postgres/Auth/Studio. Re-enable on macOS/Linux or if you need log analytics.
[analytics]
enabled = false

[experimental]
orioledb_version = ""
